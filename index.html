<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaraad Kamal</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" href="assets/logo_blue.png" />
    <script src="script.js"></script>

    <!-- For fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&family=Open+Sans:wght@500&family=Rajdhani:wght@600&family=Ubuntu&family=Zen+Maru+Gothic:wght@900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="image-container always-visible full-width screen-full-height"
      id="main-banner"
    >
      <div class="overlay responsive">
        <h1 id="my-name">Jaraad Kamal</h1>
        <p class="subtitle">Software engineer</p>
      </div>
    </div>
    <nav class="always-visible" id="navbar">
      <a class="nav-button" id="about-nav" onclick="toggleFeatured(ABOUT_INDEX)"
        >About</a
      >
      <a
        class="nav-button resume"
        id="resume-nav"
        onclick="toggleFeatured(RESUME_INDEX)"
        >Resume</a
      >
      <a
        class="nav-button projects"
        id="projects-nav"
        onclick="toggleFeatured(PROJECTS_INDEX)"
        >Projects</a
      >
    </nav>

    <div class="featured section" id="about">
      <img src="assets/profile.jpg" alt="picture of Jaraad" />
      <div class="text-box">
        <div class="summary" id="about-summary">
          <!-- dynamically filled summary from info.json -->
        </div>
      </div>
    </div>
    <div class="featured section" id="resume">
      <div id="skills">
        <div class="section-break full-width">
          <h2>Skills</h2>
          <!-- Dynamically filled with info.json values -->
        </div>
      </div>
      <div id="career">
        <div class="section-break full-width">
          <h2>Career</h2>
        </div>
        <!-- dynamically filling with info.json values -->
      </div>
      <div id="education">
        <div class="section-break full-width">
          <h2>Education</h2>
        </div>
        <!-- Dynamically filling with info.json -->
      </div>
      <div id="resume-download">
        <a class="button" href="assets/Jaraad Kamal Resume.pdf" download>
          Download
        </a>
      </div>
    </div>
    <div class="featured section" id="projects">
      <div class="slider-wrapper">
        <div class="slider" id="project-slider">
          <!-- Dynamically filling projects from info.json -->
        </div>
        <div class="slider-nav exclude-full-width-on-mobile"></div>
        <img
          src="assets/back.png"
          id="project-prev"
          onclick="prevProject()"
          alt="back button"
        />
        <img
          src="assets/next.png"
          id="project-next"
          onclick="nextProject()"
          alt="next button"
        />
      </div>
    </div>

    <div class="section always-visible" id="final-section">
      <div class="links">
        <h1>Links</h1>
        <div class="icon-holder">
          <a
            href="https://www.linkedin.com/in/jaraad-kamal/"
            class="icon-link"
            target="_blank"
            title="LinkedIn"
          >
            <img
              src="/assets/linkedin-icon.png"
              class="full-width full-height"
              alt="linkedin button"
            />
          </a>
          <a
            href="https://github.com/Camelot314"
            class="icon-link"
            target="_blank"
            title="GitHub"
          >
            <img
              src="/assets/github-icon.png"
              class="full-width full-height"
              alt="GitHub button"
            />
          </a>
          <a
            href="mailto:kjaraad@gmail.com"
            class="icon-link"
            target="_blank"
            title="Email"
          >
            <img
              src="/assets/mail-icon.png"
              class="full-width full-height"
              alt="email button"
            />
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
