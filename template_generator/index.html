<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume JSON Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans+Mono:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 id="site-title">JSON Template Generator</h1>
    <form>
      <!-- About -->
      <div class="section">
        <h2>About</h2>

        <button
          type="button"
          class="simple-button"
          onclick="addDescriptionForm('aboutDescriptionContainer','aboutDescriptionLine')"
        >
          Add summary paragraph
        </button>
        <div id="aboutDescriptionContainer"></div>
      </div>

      <!-- Resume -->
      <div class="section">
        <h2>Resume</h2>
        <!-- Skills -->
        <h2>Skills</h2>
        <div id="skillCategoriesContainer"></div>
        <button
          type="button"
          class="simple-button"
          onclick="addSkillCategory()"
        >
          Add Skill Category
        </button>

        <!-- Careers -->
        <h2>Careers</h2>
        <div id="careersContainer"></div>
        <button type="button" class="simple-button" onclick="addCareer()">
          Add Career
        </button>

        <!-- Education -->
        <h2>Education</h2>
        <div id="educationContainer"></div>
        <button type="button" class="simple-button" onclick="addEducation()">
          Add Education
        </button>
      </div>

      <!-- Projects -->
      <div class="section">
        <h2>Projects</h2>
        <button type="button" class="simple-button" onclick="addProject()">
          Add Project
        </button>
        <div id="projectsContainer"></div>
      </div>
    </form>
    <div id="button-row">
      <label for="jsonFileInput">
        <div id="upload-button"><img src="./assets/upload.png" /></div>
      </label>
      <input
        type="file"
        id="jsonFileInput"
        accept=".json"
        onchange="handleFileSelect(event)"
      />
      <div class="row">
        <button type="button" class="icon-button" onclick="downloadJSON()">
          <img src="./assets/download.png" />
        </button>
        <button type="button" class="simple-button" onclick="generateJSON()">
          Generate
        </button>
        <button type="button" class="icon-button" onclick="clearAll()">
          <img src="./assets/delete.png" />
        </button>
      </div>
    </div>

    <div class="section" id="output-section">
      <h4>Output:</h4>
      <div id="output-box">
        <pre id="jsonOutput"></pre>
      </div>
    </div>
  </body>
</html>
